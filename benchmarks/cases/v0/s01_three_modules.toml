id = "s01_three_modules"
category = "subagent"
fixture = "s01_three_modules"
notes = "子 agent：三块互相独立的调查可以并行委派。对照 core（只能串行读）与 full（可委派）。"

prompt = """
modules/ 下有 m1、m2、m3 三块互相独立的模块，每块的 README.md 里有一行 CODE=<值>。
请收集这三块模块的 CODE，按 m1、m2、m3 的顺序直接拼接（不加任何分隔符）。

回答格式：joined=<拼接结果>
"""

[limits]
max_rounds = 14
timeout_seconds = 300

[[graders]]
kind = "answer_contains"
text = ["joined=AC-31BD-72CE-19"]
