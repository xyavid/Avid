id = "rec02_failing_command"
category = "recovery"
fixture = "rec02_failing_command"
notes = "恢复：脚本打印了需要的值但退出码为 1。把非零退出码当成整体失败就会答不出。"

prompt = """
工作目录里有一个 scripts/check.py。请运行它，并把它这次运行打印出来的 KEY 值报告给我。

注意：脚本的退出码不代表它的输出无效。

回答格式：key=<KEY 的值>
"""

[limits]
timeout_seconds = 240

[[graders]]
kind = "answer_contains"
text = ["key=Q7-2291"]
