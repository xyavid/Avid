id = "b01_largest_file"
category = "basic"
fixture = "b01_largest_file"
notes = "基础：读文件 + 计数 + 比较。行数故意做成 12/137/41/58，避免与正文数字混淆。"

prompt = """
工作目录里有若干文本文件（含子目录）。找出其中行数最多的那一个，只统计 .txt 与 .md 文件，
不统计其它扩展名，也不要把目录算进去。

回答格式：文件相对路径 行数，例如 `notes.txt 12`
"""

[limits]
timeout_seconds = 240

[[graders]]
kind = "answer_contains"
text = ["beta.txt", "137"]

[[graders]]
name = "fixture-不变量"
kind = "command"
run = "test \"$(wc -l < beta.txt)\" -eq 137"
