id = "b02_column_sum"
category = "basic"
fixture = "b02_column_sum"
notes = "基础：单文件 + 聚合计算。真值 4176 由 fixture 唯一确定。"

prompt = """
工作目录里的 values.csv 有两列：x 与 y，第一行是表头。请算出 y 列所有数据行之和。

回答格式：sum=<数字>，数字不要带千分位分隔符
"""

[limits]
timeout_seconds = 240

[[graders]]
kind = "answer_contains"
text = ["sum=4176"]

[[graders]]
name = "fixture-不变量"
kind = "command"
run = "test \"$(awk -F, 'NR>1{s+=$2} END{print s}' values.csv)\" -eq 4176"
