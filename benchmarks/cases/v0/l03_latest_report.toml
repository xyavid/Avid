id = "l03_latest_report"
category = "long_horizon"
fixture = "l03_latest_report"
notes = "长程：必须先读全部 8 份报告才能定出最新一期（日期写在文件内容里，文件名不体现顺序）。"

prompt = """
reports/ 下有若干期报告。每份报告的第一行写着出报告的日期（date: YYYY-MM-DD），
后面写着该期的指标值 metric。请找出日期最新的那一期，报告它的 metric。

回答格式：metric=<数字>
"""

[limits]
max_rounds = 16
timeout_seconds = 300

[[graders]]
kind = "answer_contains"
text = ["metric=488"]
