id = "c04_dag_hidden_order"
category = "task"
fixture = "c04_dag_hidden_order"
tier = 4
notes = "依赖组：顺序不写在题面里，要从每份文件的 requires 行推出来；字典序 ≠ 拓扑序，所以「按文件名顺序读」会得到错答案。tie-break 规则写在题面里，保证唯一解。"

prompt = """
steps/ 下有 12 份文件，每份有两行：code=<值> 与 requires: <它依赖的步骤名，逗号分隔或 none>。
请按依赖顺序执行（每份都要等它的 requires 全部完成），把 12 个 code 依次拼接起来。
同一时刻有多个可做的步骤时，按文件名字典序选（s01 < s02 < … < s12）。

回答格式：joined=<拼接结果>
"""

[limits]
timeout_seconds = 300

[[graders]]
kind = "answer_contains"
text = ["joined=ZB05RM72LE28TP18AN37QK41CR84FB52WX93HV60GS69DM11"]
