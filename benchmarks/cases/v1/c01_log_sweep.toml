id = "c01_log_sweep"
category = "long_horizon"
fixture = "c01_log_sweep"
tier = 3
notes = "长上下文组：36 个分片、唯一一条 critical。这一组的作用是把消息数推过 snip 阈值（50），看早期结论会不会被剪掉后被迫重读。"

prompt = """
parts/ 下有 36 个日志分片。请找出 severity=critical 的那条记录，报告它这一行里的 ticket 值。

回答格式：ticket=<值>
"""

[limits]
timeout_seconds = 420

[[graders]]
kind = "answer_contains"
text = ["ticket=TK-4821"]

[[graders]]
name = "fixture-不变量"
kind = "command"
run = "test \"$(grep -rl 'severity=critical' parts | wc -l)\" -eq 1"
