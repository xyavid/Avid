<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans CJK SC', sans-serif" role="img" aria-label="Avid 阶段 0 架构图">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="470" fill="#ffffff"/>

  <text x="40" y="38" font-size="19" font-weight="700" fill="#111827">Avid 阶段 0 — 工程基线与最小模型调用</text>
  <text x="40" y="61" font-size="12.5" fill="#6b7280">只打通一条线：配置 → 一次真实模型调用 → 打印回复与 token 用量</text>

  <!-- 外部：环境变量 -->
  <rect x="40" y="92" width="190" height="66" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="135" y="117" font-size="14" fill="#111827" text-anchor="middle">环境变量 / .env</text>
  <text x="135" y="138" font-size="11.5" fill="#6b7280" text-anchor="middle">AVID_API_KEY · BASE_URL · MODEL</text>

  <!-- 外部：API -->
  <rect x="310" y="92" width="190" height="66" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="405" y="117" font-size="14" fill="#111827" text-anchor="middle">OpenAI 兼容 API</text>
  <text x="405" y="138" font-size="11.5" fill="#6b7280" text-anchor="middle">POST /chat/completions</text>

  <!-- 外部：终端 -->
  <rect x="580" y="92" width="190" height="66" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="675" y="117" font-size="14" fill="#111827" text-anchor="middle">终端 stdout</text>
  <text x="675" y="138" font-size="11.5" fill="#6b7280" text-anchor="middle">回复文本 + token 用量</text>

  <!-- 内部模块 -->
  <rect x="40" y="230" width="190" height="92" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
  <text x="135" y="258" font-size="15" font-weight="600" fill="#111827" text-anchor="middle" font-family="ui-monospace, monospace">config.py</text>
  <text x="135" y="282" font-size="11.5" fill="#4b5563" text-anchor="middle">读取并校验三个环境变量</text>
  <text x="135" y="301" font-size="11.5" fill="#4b5563" text-anchor="middle">缺 key 时报错并给出设置方法</text>

  <rect x="310" y="230" width="190" height="92" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
  <text x="405" y="258" font-size="15" font-weight="600" fill="#111827" text-anchor="middle" font-family="ui-monospace, monospace">llm.py</text>
  <text x="405" y="282" font-size="11.5" fill="#4b5563" text-anchor="middle">构造请求体并解析响应</text>
  <text x="405" y="301" font-size="11.5" fill="#4b5563" text-anchor="middle">返回回复文本 + token 用量</text>

  <rect x="580" y="230" width="190" height="92" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
  <text x="675" y="258" font-size="15" font-weight="600" fill="#111827" text-anchor="middle" font-family="ui-monospace, monospace">cli.py</text>
  <text x="675" y="282" font-size="11.5" fill="#4b5563" text-anchor="middle">命令行入口 avid "问题"</text>
  <text x="675" y="301" font-size="11.5" fill="#4b5563" text-anchor="middle">格式化输出回复与用量</text>

  <!-- 数据流 -->
  <path d="M 135 158 L 135 230" class="flow" stroke="#4b5563" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <text x="145" y="199" font-size="11.5" fill="#374151">AVID_* 变量</text>

  <path d="M 230 276 L 310 276" stroke="#4b5563" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <text x="236" y="268" font-size="11.5" fill="#374151">Config 对象</text>

  <path d="M 405 230 L 405 158" stroke="#4b5563" stroke-width="1.8" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="415" y="196" font-size="11.5" fill="#374151">请求 {model, messages}</text>
  <text x="415" y="212" font-size="11.5" fill="#374151">响应 {content, usage}</text>

  <path d="M 500 276 L 580 276" stroke="#4b5563" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <text x="506" y="268" font-size="11.5" fill="#374151">回复 + usage</text>

  <path d="M 675 230 L 675 158" stroke="#4b5563" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <text x="685" y="199" font-size="11.5" fill="#374151">格式化输出</text>

  <!-- 验证层 -->
  <rect x="40" y="366" width="730" height="66" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="60" y="392" font-size="13" font-weight="600" fill="#111827" font-family="ui-monospace, monospace">tests/</text>
  <text x="60" y="414" font-size="11.5" fill="#4b5563" font-family="ui-monospace, monospace">test_config.py — 缺 key 时的报错；test_llm.py — 请求体与 usage 解析（MockTransport，不联网）</text>

  <text x="790" y="392" font-size="11" fill="#9ca3af" text-anchor="end">虚线 = 进程外部</text>
  <text x="790" y="414" font-size="11" fill="#9ca3af" text-anchor="end">阶段 0 · 尚无工具调用</text>
</svg>
