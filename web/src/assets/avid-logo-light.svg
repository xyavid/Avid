<!-- Avid 标识 · README 用（浅色底），**背景透明**：不做圆托、不垫色板，
     直接贴在页面上（与 web/src/assets/avid-mark.svg 同一条纪律）。
     构成：荷花 + 字标。
       · 荷花的 9 条 path 逐字来自 web/src/assets/avid-mark.svg（副本对账在
         web/src/ui/__tests__/Mark.test.tsx，漂移会当场报错），颜色照搬原样；
       · 字标 "Avid" 是**轮廓化**的 path，查看端没有字体也不跑版：Inter SemiBold
         （fontsource 5.3.0，web/node_modules/@fontsource/inter），墨迹高 58px、
         字距取 GPOS 成对字距，左起 x=130px、墨迹中心对齐荷花中心 y=52px。
       字标用暖纸墨色 #3B3D3F，给浅色页面（GitHub 默认主题）；荷花是淡色低对比（压纸色只有 1.15，见 favicon.svg 注释），透明底上它就是一层浅影。 -->
