name: CI

on:
  push:
  pull_request:

jobs:
  kernel:
    name: 内核（ruff + mypy + pytest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 同步依赖（含 dev group）
        run: uv sync --group dev
      - name: 代码风格与明显错误
        run: uv run ruff check src tests
      - name: 类型检查
        run: uv run mypy
      - name: 测试（stress 由单独 job 跑）
        run: uv run pytest -q

  stress:
    name: 长会话与性能门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      # 显式 -m stress：这类门禁默认不跑（pyproject 的 addopts 排除了它），
      # 但必须**存在一个会执行它的地方**，否则"门禁存在"与"门禁被执行"又会脱钩。
      - name: 跑 stress 门禁
        run: uv run pytest -q -m stress

  web:
    name: 前端（构建/类型/单测）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          # 24 = 本机基线（`web/README.md` 的 Node 下限）。
          # Node 20 装得下依赖、其余门禁也照过，但 jsdom 30 → undici 8 用了
          # `node:worker_threads.markAsUncloneable`（Node ≥ 22.19 才有），于是要等
          # vitest 起 jsdom 时才炸成一条 unhandled error。同一个下限也写进
          # web/package.json 的 engines，由 web/.npmrc 的 engine-strict 在
          # `pnpm install` 阶段就失败。
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 安装依赖
        working-directory: web
        run: pnpm install --frozen-lockfile
      # 阶段 32 把旧前端（页面/组件/样式/静态资源）整体删除，五个门禁脚本
      # （check:layers / check:tokens / lint / check:contrast / gate:size）随之删除：
      # 它们检查的目录结构、token 表与产物都不存在了，budget.json 的冻结体积也一并作废。
      # 新的门禁要等视觉与分层方案定稿后重建——在那之前这里只守三件仍然成立的事：
      # 打包链能跑（vite build）、类型自洽（tsc）、用例非空转（vitest）。
      - name: 构建
        working-directory: web
        run: pnpm run build
      - name: 类型检查
        working-directory: web
        run: pnpm run typecheck
      - name: 单测（骨架 smoke，2 条）
        working-directory: web
        run: pnpm test
