name: CI

on:
  push:
  pull_request:

jobs:
  kernel:
    name: 内核（ruff + mypy + pytest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 同步依赖（含 dev group）
        run: uv sync --group dev
      - name: 代码风格与明显错误
        run: uv run ruff check src tests
      - name: 类型检查
        run: uv run mypy
      - name: 测试（stress 由单独 job 跑）
        run: uv run pytest -q

  stress:
    name: 长会话与性能门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      # 显式 -m stress：这类门禁默认不跑（pyproject 的 addopts 排除了它），
      # 但必须**存在一个会执行它的地方**，否则"门禁存在"与"门禁被执行"又会脱钩。
      - name: 跑 stress 门禁
        run: uv run pytest -q -m stress

  web:
    name: 前端（分层/样式/单测/体积）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          # 24 = 本机基线（`docs/design/frontend-architecture.md` 的「当前基线」）。
          # Node 20 装得下依赖、其余门禁也照过，但 jsdom 30 → undici 8 用了
          # `node:worker_threads.markAsUncloneable`（Node ≥ 22.19 才有），于是要等
          # vitest 起 jsdom 时才炸成一条 unhandled error。同一个下限也写进
          # web/package.json 的 engines，由 web/.npmrc 的 engine-strict 在
          # `pnpm install` 阶段就失败。
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - working-directory: web
        run: pnpm install --frozen-lockfile
      # gate:size 的输入是 dist/（web/scripts/gate-size.mjs:71-80），而 dist/ 不入库：
      # 不先 build，它只会回一句「先 pnpm build」然后 exit 1。顺带把 `vite build`
      # 本身纳入门禁——此前 CI 只跑过 tsc，打包链坏了没人知道。
      - name: 构建（gate:size 的输入）
        working-directory: web
        run: pnpm run build
      # verify = check:layers + check:tokens + lint + check:contrast + typecheck + vitest + gate:size
      - working-directory: web
        run: pnpm run verify
