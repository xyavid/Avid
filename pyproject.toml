[project]
name = "avid"
version = "0.0.1"
description = "自建 agent 运行时（harness）：先做通用内核，场景后接"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.scripts]
avid = "avid.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
